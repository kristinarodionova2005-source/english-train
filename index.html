<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Английский тренажёр</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one calm column, a tab per lesson, each exercise is a card that checks itself. */
:root {
  --bg: #f3f5fb; --card: #ffffff; --ink: #1d2340; --muted: #5d6585; --line: #dde2f0;
  --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e6ebff;
  --good: #167a52; --good-soft: #e1f5ec; --bad: #c2255c; --bad-soft: #fdeaf1; --chip: #eef1fa;
  --f-head: "Space Grotesk", system-ui, sans-serif; --f-body: "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12162b; --card: #1a2040; --ink: #e8ebff; --muted: #a2abd0; --line: #2d3560;
  --accent: #8ea2ff; --accent-ink: #10142b; --accent-soft: #252d5c;
  --good: #5fd9a2; --good-soft: #17382f; --bad: #ff7fa6; --bad-soft: #43203a; --chip: #242b52; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #12162b; --card: #1a2040; --ink: #e8ebff; --muted: #a2abd0; --line: #2d3560;
  --accent: #8ea2ff; --accent-ink: #10142b; --accent-soft: #252d5c;
  --good: #5fd9a2; --good-soft: #17382f; --bad: #ff7fa6; --bad-soft: #43203a; --chip: #242b52; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 22px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-head); margin: 0; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.2; }
h2 { font-size: 20px; line-height: 1.3; }
.top { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
.who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.who input { min-width: 0; flex: 1 1 140px; max-width: 240px; }
input[type=text], textarea, select { font: inherit; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
  border-radius: 8px; padding: 6px 10px; }
input[type=text]:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meter { background: var(--line); border-radius: 99px; height: 9px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .35s; }
.meter-label { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
.tab { font: 600 14px var(--f-body); background: var(--chip); color: var(--ink); border: 0; border-radius: 99px; padding: 8px 16px; cursor: pointer; }
.tab[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.lead { display: flex; flex-direction: column; gap: 10px; }
.lead p { margin: 0; color: var(--muted); }
.btn { font: 600 14px var(--f-body); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn[disabled] { opacity: .5; cursor: default; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
.ex-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ex-head .tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.ex-head .best { font-size: 13px; color: var(--good); font-weight: 600; font-variant-numeric: tabular-nums; }
.ins { color: var(--muted); font-size: 13.5px; margin: 4px 0 12px; }
.item { padding: 9px 10px; border-radius: 10px; border: 1.5px solid transparent; margin-bottom: 4px; min-width: 0; }
.item .q { display: block; margin-bottom: 6px; }
.item.ok { background: var(--good-soft); border-color: var(--good); }
.item.bad { background: var(--bad-soft); border-color: var(--bad); }
.note { display: block; font-size: 13px; margin-top: 4px; color: var(--bad); font-weight: 500; overflow-wrap: anywhere; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { display: inline-flex; align-items: center; gap: 6px; background: var(--chip); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 14px; border: 1.5px solid transparent; }
.opt input { accent-color: var(--accent); }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.seg { font: 600 13px var(--f-body); border: 1.5px solid var(--line); background: var(--card); color: var(--ink); padding: 5px 16px; border-radius: 8px; cursor: pointer; }
.seg.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.gapin { width: 9.5em; max-width: 100%; margin: 0 4px; }
.gapin.wide { width: 100%; margin: 6px 0 0; display: block; }
.box { background: var(--chip); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 10px; font-weight: 500; overflow-wrap: anywhere; }
.build { min-height: 44px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 6px; display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.bank { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 14px var(--f-body); background: var(--chip); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.build .chip { background: var(--accent-soft); border-color: var(--accent); }
textarea { width: 100%; min-height: 96px; resize: vertical; }
.model { margin-top: 10px; padding: 12px; border-radius: 10px; background: var(--good-soft); border: 1.5px solid var(--good); font-size: 14px; }
.model b { display: block; margin-bottom: 4px; }
.sumbox { margin-top: 12px; }
.sumbox textarea { min-height: 150px; font-size: 13px; }
.rec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.player { width: 100%; margin-top: 10px; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
.sub { font: 600 13px var(--f-body); background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 99px; padding: 6px 13px; cursor: pointer; }
.sub[aria-selected=true] { background: var(--accent-soft); border-color: var(--accent); }
.days { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.dayb { display: inline-flex; gap: 8px; align-items: center; font: 600 13px var(--f-body); background: var(--chip); color: var(--ink); border: 0; border-radius: 10px; padding: 7px 12px; cursor: pointer; }
.dayb[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); }
.dayb .dc { font-variant-numeric: tabular-nums; font-weight: 500; opacity: .85; }
.day-badge { display: inline-block; font: 600 11px var(--f-body); letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; align-self: flex-start; }
.day-badge.mon { background: var(--accent-soft); color: var(--ink); }
.day-badge.thu { background: var(--good-soft); color: var(--good); }
.ex-title { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.hint { margin: 0 0 8px; font-weight: 400; color: var(--muted); font-size: 13px; }
.wbank { display: flex; flex-wrap: wrap; gap: 8px; }
.wchip { font: 600 14px var(--f-body); background: var(--card); color: var(--ink); border: 1.5px solid var(--accent); border-radius: 10px; padding: 5px 12px; cursor: grab; }
.wchip:active { cursor: grabbing; }
.wchip.on { background: var(--accent); color: var(--accent-ink); }
.gapin.drop { border-style: dashed; }
.gapin.over { border-color: var(--accent); background: var(--accent-soft); }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 14px; }
.confetti i { position: absolute; top: -14px; width: 8px; height: 12px; border-radius: 2px; animation: fall 1.3s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 460px) rotate(540deg); opacity: 0; } }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.place-badge { display: inline-block; font: 600 11px var(--f-body); letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 2px 8px; }
.place-badge.L { background: var(--accent); color: var(--accent-ink); }
.place-badge.H { background: var(--chip); color: var(--ink); border: 1px solid var(--line); }
.day-badge.kind { background: var(--bad-soft); color: var(--bad); }
body.pdfmode { --bg: #ffffff; --card: #ffffff; --ink: #1d2340; --muted: #5d6585; --line: #dde2f0; --accent: #3b5bdb; --accent-ink: #ffffff; --accent-soft: #e6ebff;
  --good: #167a52; --good-soft: #e1f5ec; --bad: #c2255c; --bad-soft: #fdeaf1; --chip: #eef1fa; background: #ffffff; color-scheme: light; }
.pdfmode .actions .btn, .pdfmode .rec, .pdfmode .confetti, .pdfmode .hint { display: none !important; }
.pdfmode .card { margin-bottom: 0; }
.pagebar .actions { margin-top: 0; }
.theory { padding: 12px 18px; }
.theory summary { cursor: pointer; font: 600 15px var(--f-head); }
.theory .tbody { margin-top: 10px; font-size: 14px; }
.theory .tbody p { margin: 8px 0; }
.theory .tbody ul { margin: 6px 0 6px 18px; padding: 0; }
.theory .tbody li { margin: 3px 0; }
.theory .tw { overflow-x: auto; margin: 8px 0; }
.theory table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.theory th, .theory td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.theory th { background: var(--chip); font-weight: 600; }
.foot { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .meter > i { transition: none; } }
[hidden]{display:none!important}
</style>

</head><body>
<div class="wrap">
  <div class="top">
    <h1>Английский тренажёр</h1>
    <div class="who"><label for="name">Имя:</label><input id="name" type="text" placeholder="Варя" autocomplete="off"></div>
    <div>
      <div class="meter" role="progressbar" aria-label="Прогресс" aria-valuemin="0" aria-valuemax="100" id="mbar"><i id="mfill"></i></div>
      <div class="meter-label"><span id="mtxt"></span><span id="mpts"></span></div>
    </div>
  </div>
  <div class="days" id="days" role="group" aria-label="День недели"></div>
  <div class="days" id="places" role="group" aria-label="Урок или дом"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <div class="card" id="summary">
    <h2>Результат для учителя</h2>
    <p class="ins">Нажми «Скачать результат», открой Telegram учителя и прикрепи файл (скрепка). Голосовые из заданий speaking отправляй так же.</p>
    <div class="actions">
      <button class="btn" id="dlres">Скачать результат (файл)</button>
      <a class="btn" id="tglink" href="https://t.me/krrodionovaa" target="_blank" rel="noopener">Открыть Telegram учителя</a>
      <button class="btn ghost" id="copy">Скопировать результат</button>
      <button class="btn ghost" id="mail">Открыть письмо с результатом</button>
      <button class="btn ghost" id="reset">Сбросить прогресс</button>
    </div>
    <div class="sumbox" id="sumbox" hidden><textarea id="sumtext" readonly aria-label="Текст результата"></textarea></div>
    <div class="foot" id="resetask" hidden><span>Весь прогресс будет удалён.</span>
      <button class="btn" id="resetyes">Да, сбросить</button><button class="btn ghost" id="resetno">Отмена</button></div>
  </div>
</div>

<script>
const VIDEO_URL = "https://learnenglish.britishcouncil.org/general-english/video-series/starting-out/episode-15-there-campsite";
const OLD = [
  { id: "video", tab: "Видео", title: "Is there a campsite?",
    lead: { text: "British Council, Starting Out, Episode 15. Посмотри видео два раза: сначала без остановок, потом ещё раз с текстом (под видео на странице есть Transcript).", link: VIDEO_URL, linkText: "Открыть видео" },
    ex: [
    { id: "v0", type: "open", title: "Before you watch", ins: "Ответь письменно или вслух (2–3 предложения).",
      items: [{ q: "Do you like camping? Why / why not?" }, { q: "What does a good campsite have?" }, { q: "Do you prefer tents or hotels on holiday?" }],
      model: "I like camping because I love nature. A good campsite has a shop, showers and a swimming pool. I prefer hotels because they are more comfortable." },
    { id: "v1", type: "tf", title: "True or false?", ins: "Смотри видео и выбери True или False.",
      items: [
        { q: "Sammy wants to take Julia to his favourite campsite.", a: true },
        { q: "Julia loves camping.", a: false },
        { q: "The campsite has a big swimming pool.", a: true },
        { q: "The campsite has a ski slope.", a: false },
        { q: "Julia hates tents.", a: true },
        { q: "Sammy says there are wooden huts at the campsite.", a: true },
        { q: "The campsite is still open.", a: false },
        { q: "At the end, Julia suggests finding a hotel.", a: true }] },
    { id: "v2", type: "tick", title: "What does the campsite have?", ins: "Отметь только то, что называет Sammy.",
      items: [
        { q: "a swimming pool", a: true }, { q: "a cinema", a: false }, { q: "a gym", a: true }, { q: "a ski slope", a: false },
        { q: "a sauna", a: true }, { q: "a golf course", a: false }, { q: "a small lake", a: true }, { q: "a zoo", a: false },
        { q: "a supermarket", a: true }, { q: "bike hire", a: true }, { q: "a jacuzzi", a: true }, { q: "a library", a: false }] },
    { id: "v3", type: "mcq", title: "Watch again: choose the answer", ins: "Выбери один вариант.",
      items: [
        { q: "Where does Sammy want to go?", o: ["to a campsite", "to a beach", "to a hotel"], a: 0 },
        { q: "How many tennis courts does the campsite have?", o: ["two", "four", "six"], a: 1 },
        { q: "What does Julia prefer to camping?", o: ["hotels", "caravans", "friends' houses"], a: 0 },
        { q: "What does Sammy offer instead of tents?", o: ["caravans", "wooden huts", "a big hotel"], a: 1 },
        { q: "Who do Sammy and Julia ask about the campsite?", o: ["a woman in the street", "a policeman", "a hotel manager"], a: 0 },
        { q: "What happened to the campsite?", o: ["It closed ten years ago.", "It is full today.", "It moved to another town."], a: 0 },
        { q: "When was Sammy last at the campsite?", o: ["last year", "about ten years ago, on a school trip", "he has never been there"], a: 1 }] },
    { id: "v4", type: "gap", title: "There is / There are", ins: "Впиши слово или слова: there is, there are, is, are.",
      items: [
        { q: "___ a big swimming pool at the campsite.", a: ["there is", "there's"] },
        { q: "___ four tennis courts.", a: ["there are"] },
        { q: "___ there any shops in the village?", a: ["are"] },
        { q: "___ there a gym at the campsite?", a: ["is"] },
        { q: "There ___ a bar with live music every night.", a: ["is", "'s"] },
        { q: "There ___ any ski slopes. (no)", a: ["aren't", "are not"] }] },
    { id: "v5", type: "order", title: "Make questions and sentences", ins: "Нажимай на слова по порядку, чтобы собрать предложение.",
      items: [
        { a: "Is there a swimming pool?" },
        { a: "Are there any shops in the village?" },
        { a: "How many tennis courts are there?" },
        { a: "There is a small lake in the middle." },
        { a: "There isn't a campsite here now." }] },
    { id: "v6", type: "match", title: "Words from the video", ins: "Выбери значение для каждого слова.",
      opts: ["a small simple building", "buildings and equipment for sports and free time", "to like one thing more than another", "a place where you put up tents", "not knowing where you are"],
      items: [{ q: "hut", a: 0 }, { q: "facilities", a: 1 }, { q: "prefer", a: 2 }, { q: "campsite", a: 3 }, { q: "lost", a: 4 }] },
    { id: "v7", type: "open", title: "Answer the questions", ins: "Ответь одним предложением, потом открой образец.",
      items: [{ q: "Why doesn't Julia want to go to the campsite?" }, { q: "What does Sammy offer instead of tents?" },
              { q: "What happened to the campsite?" }, { q: "What does Julia suggest at the end?" }],
      model: "1. She doesn't like camping, she hates tents and prefers hotels.\n2. He offers small wooden huts with kitchens and bedrooms.\n3. It closed ten years ago and the town was built on it.\n4. She suggests finding a hotel." },
    { id: "v8", type: "speak", title: "Speaking: your opinion", ins: "Скажи вслух за 1 минуту или запиши. Используй: I prefer… because…, In my opinion…, there is / there are.",
      items: [{ q: "Camping is better than staying in a hotel. Do you agree? Give two reasons and one example from your life." }],
      model: "In my opinion, camping is better because you can be close to nature and it is cheap. For example, last summer we were putting up a tent by a lake when it started to rain, but it was still fun. On the other hand, hotels are more comfortable." }
    ] },
  { id: "grammar", tab: "Grammar", title: "Past Continuous & mixed tenses",
    lead: { text: "Упражнения проверяются сразу. Можно пробовать заново, лучший результат сохраняется. В письменных заданиях возможны и другие верные варианты: сравни с образцом." },
    ex: [
    { id: "x4", type: "mcq", title: "Choose the correct expression", ins: "Circle A or B.",
      items: [
        { q: "I woke up late, so I ___ my clothes and ran out of the house.", o: ["threw on", "turned out"], a: 0 },
        { q: "She was ___ because she had broken the neighbour's window.", o: ["out of breath", "in trouble"], a: 1 },
        { q: "Don't ___ — we have plenty of time.", o: ["rush", "cheer up"], a: 0 },
        { q: "I couldn't ___ a good excuse.", o: ["come up with", "come across"], a: 0 },
        { q: "It was raining, and ___, we had forgotten the umbrella.", o: ["it could be worse", "to make matters worse"], a: 1 },
        { q: "Tom's ___ the holiday: he's already packed his bag.", o: ["fed up with", "looking forward to"], a: 1 }] },
    { id: "x5", type: "mcq", title: "Choose the correct tense", ins: "Circle A, B or C. В предложениях 6 и 9 два пропуска: они разделены на a и b.",
      items: [
        { q: "What ___ at 8 o'clock last night?", o: ["did you do", "were you doing", "have you done"], a: 1 },
        { q: "Look at those clouds! It ___ rain.", o: ["will", "is going to", "rains"], a: 1 },
        { q: "I ___ camping, so I'm a bit nervous.", o: ["didn't go", "wasn't going", "have never been"], a: 2 },
        { q: "\"I'm cold.\" \"I ___ close the window.\"", o: ["am going to", "will", "close"], a: 1 },
        { q: "She ___ in the garden when it started to rain.", o: ["worked", "was working", "has worked"], a: 1 },
        { q: "6a. My dad usually ___ to work.", o: ["drives", "is driving", "drive"], a: 0 },
        { q: "6b. ...but today he ___ the bus.", o: ["takes", "is taking", "take"], a: 1 },
        { q: "We ___ to the lake last summer.", o: ["have gone", "were going", "went"], a: 2 },
        { q: "I ___ here since Monday.", o: ["am", "was", "have been"], a: 2 },
        { q: "9a. While I ___, my brother was putting up the tent.", o: ["cooked", "was cooking", "cook"], a: 1 },
        { q: "9b. While I was cooking, my brother ___ the tent.", o: ["put up", "was putting up", "puts up"], a: 1 },
        { q: "\"Have you finished?\" \"Not yet. I ___ the tent.\"", o: ["still put up", "am still putting up", "was still putting up"], a: 1 }] },
    { id: "x6", type: "write", title: "Write sentences in the Past Continuous", ins: "Use the words in the right order and add what is necessary. (+) утверждение, (–) отрицание, (?) вопрос. Напиши предложение целиком.",
      items: [
        { q: "at 7.30 yesterday / I / rush / to the bus stop (+)", a: ["At 7.30 yesterday I was rushing to the bus stop.", "I was rushing to the bus stop at 7.30 yesterday."] },
        { q: "at noon / Tom / not / drive — he / wait / for the mechanic (–)", a: ["At noon Tom wasn't driving; he was waiting for the mechanic.", "At noon Tom was not driving; he was waiting for the mechanic.", "At noon Tom wasn't driving but he was waiting for the mechanic.", "At noon Tom wasn't driving, he was waiting for the mechanic.", "At noon Tom wasn't driving and he was waiting for the mechanic."] },
        { q: "what / the children / do / when / the farmer / stop (?)", a: ["What were the children doing when the farmer stopped?"] },
        { q: "you / look forward / to the trip / last week (?)", a: ["Were you looking forward to the trip last week?"] },
        { q: "all evening / it / rain / and we / sit / in the tent (+)", a: ["It was raining all evening and we were sitting in the tent.", "All evening it was raining and we were sitting in the tent."] },
        { q: "I / not / pay attention, so / I / not / hear / the question (–)", a: ["I wasn't paying attention, so I didn't hear the question.", "I was not paying attention, so I did not hear the question.", "I wasn't paying attention, so I did not hear the question.", "I was not paying attention, so I didn't hear the question."] }] },
    { id: "x7", type: "write", title: "Join the ideas with when / while / as", ins: "Decide which action was longer and which one interrupted it. The order of the parts can change. Напиши предложение целиком.",

    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), M = 28, CW = PW - 2 * M, GAP = 10;
    let y = M, sc = 0, st = 0;
    cards.forEach(c => { if (c._last) { sc += c._last.c; st += c._last.t; } });
    const dayName = daySel === "mon" ? "понедельник" : daySel === "thu" ? "четверг" : "все дни";
    const placeName = placeSel === "L" ? "на уроке" : placeSel === "H" ? "домашнее" : "всё";
    head = h("section", { class: "card" },
      h("h2", {}, "Результаты: " + (store.name || "ученик")),
      h("p", { class: "ins" }, cur.m.title + (cur.g ? " · " + cur.g : "") + " · " + dayName + " · " + placeName),
      h("p", { class: "ins" }, new Date().toLocaleDateString("ru-RU") + (st ? " · итог страницы: " + sc + " из " + st : "")));
    view.prepend(head);
    for (const el of [head, ...cards]) {
      const cv = await html2canvas(el, { scale: 1.6, backgroundColor: "#ffffff", useCORS: true, logging: false });
      const k = CW / cv.width, hh = cv.height * k, avail = PH - 2 * M;
      if (hh <= avail) {
        if (y + hh > PH - M) { doc.addPage(); y = M; }
        doc.addImage(cv.toDataURL("image/jpeg", 0.92), "JPEG", M, y, CW, hh); y += hh + GAP;
      } else {
        const seg = Math.floor(avail / k);
        for (let top = 0; top < cv.height; top += seg) {
          const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.min(seg, cv.height - top);
          part.getContext("2d").drawImage(cv, 0, top, cv.width, part.height, 0, 0, cv.width, part.height);
          if (y > M) { doc.addPage(); y = M; }
          doc.addImage(part.toDataURL("image/jpeg", 0.92), "JPEG", M, y, CW, part.height * k); y += part.height * k + GAP;
        }
      }
    }
    const name = "results_" + slug(store.name || "student") + "_" + slug(cur.m.id + (cur.g ? "-" + cur.g : "")) + "_" + daySel + "-" + placeSel + "_" + new Date().toISOString().slice(0, 10) + ".pdf";
    const blob = doc.output("blob");
    lastPdf = { blob, name };
    if (dry) return { size: blob.size, pages: doc.getNumberOfPages(), name, cards: cards.length };
    doc.save(name);
    return { size: blob.size, name };
  } finally {
    if (head) head.remove();
    document.body.classList.remove("pdfmode"); window.scrollTo(0, y0);
  }
}

function stats() {
  const all = MODULES.flatMap(exsOf).filter(scored);
  const done = all.filter(e => store.res[e.id]).length;
  const pts = all.reduce((s, e) => s + (store.res[e.id] ? store.res[e.id].c : 0), 0);
  const max = all.reduce((s, e) => s + totalOf(e), 0);
  const pct = all.length ? Math.round(100 * done / all.length) : 0;
  document.getElementById("mfill").style.width = pct + "%";
  document.getElementById("mbar").setAttribute("aria-valuenow", pct);
  document.getElementById("mtxt").textContent = `Выполнено упражнений: ${done} из ${all.length}`;
  document.getElementById("mpts").textContent = `Баллы: ${pts} из ${max}`;
  const cnt = { all: [done, all.length], mon: [0, 0], thu: [0, 0], L: [0, 0], H: [0, 0] };
  all.forEach(e => { const p = PLAN[e.id] || []; [p[0], p[1]].forEach(k => { if (cnt[k]) { cnt[k][1]++; if (store.res[e.id]) cnt[k][0]++; } }); });
  [...daysEl.children].forEach(b => { const k = b.dataset.k; b.querySelector(".dc").textContent = cnt[k][0] + "/" + cnt[k][1]; b.setAttribute("aria-pressed", String(k === daySel)); });
  [...placesEl.children].forEach(b => { const k = b.dataset.k; b.querySelector(".dc").textContent = cnt[k][0] + "/" + cnt[k][1]; b.setAttribute("aria-pressed", String(k === placeSel)); });
  return { all, done, pts, max };
}

const TEACHER_EMAIL = "kristina.rodionova.2005@gmail.com";
function summaryText() {
  const s = stats(); const d = new Date();
  const lines = [`Результаты: ${store.name || "ученик"}, ${d.toLocaleDateString("ru-RU")}`, `Выполнено ${s.done} из ${s.all.length}, баллы ${s.pts} из ${s.max}`, ""];

  return lines.join("\n");
}
